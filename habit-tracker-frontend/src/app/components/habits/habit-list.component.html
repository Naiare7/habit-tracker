<!-- Estado de carga -->
<div *ngIf="cargando" class="habit-list-cargando">
  <span class="cargando-emoji">🌀</span>
  <p>Cargando tus hábitos...</p>
</div>

<!-- Estado vacio: no hay habitos -->
<div *ngIf="!cargando && habits.length === 0" class="habit-list-vacio">
  <span class="vacio-emoji">🌱</span>
  <h2 class="vacio-titulo">¡Aún no tienes hábitos!</h2>
  <p class="vacio-texto">Añade el primero 🌱</p>
</div>

<!-- Lista de tarjetas de habitos -->
<div *ngIf="!cargando && habits.length > 0" class="habit-list-grid">
  <div
    *ngFor="let habit of habits"
    class="habit-card"
    [class.completado]="estaCompletado(habit.id)"
    [class.celebrando]="habitoCelebradoId === habit.id"
    [style.borderLeftColor]="estaCompletado(habit.id) ? '#A8C5A0' : habit.color"
  >
    <!-- Boton de marcar/desmarcar -->
    <button
      class="check-btn"
      [class.completado]="estaCompletado(habit.id)"
      [disabled]="marcando.has(habit.id)"
      (click)="toggleHabit(habit)"
      title="Marcar como completado"
    >
      <span *ngIf="estaCompletado(habit.id)" class="check-icon">✓</span>
    </button>

    <div class="habit-card-contenido">
      <span class="habit-emoji">{{ habit.emoji }}</span>
      <div class="habit-info">
        <h3 class="habit-nombre">{{ habit.name }}</h3>
        <p class="habit-descripcion" *ngIf="habit.description">
          {{ habit.description }}
        </p>
        <span class="habit-frecuencia">
          {{ habit.frequency === 'daily' ? 'Diario' : 'Semanal' }}
        </span>
      </div>
    </div>

    <div class="habit-card-acciones">
      <button
        class="btn-icono btn-editar"
        (click)="onEditar(habit)"
        title="Editar hábito"
      >
        ✏️
      </button>
      <button
        class="btn-icono btn-eliminar"
        (click)="onEliminar(habit.id)"
        title="Eliminar hábito"
      >
        🗑️
      </button>
    </div>

    <!-- Mensaje de celebracion -->
    <div
      *ngIf="habitoCelebradoId === habit.id && mensajeCelebracion"
      class="mensaje-celebracion"
    >
      {{ mensajeCelebracion }}
    </div>
  </div>
</div>
