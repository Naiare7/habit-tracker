<div class="login-container">
  <div class="login-card">
    <h1 class="login-title">Bienvenida de nuevo 🌟</h1>
    <p class="login-subtitle">Sigue construyendo tus hábitos</p>

    <!-- Mensaje de error -->
    <div *ngIf="mensajeError" class="mensaje mensaje-error">
      {{ mensajeError }}
    </div>

    <form (ngSubmit)="iniciarSesion()" #formulario="ngForm" class="login-form">
      <div class="campo">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          placeholder="tu@email.com"
          required
        />
      </div>

      <div class="campo">
        <label for="contrasena">Contrasena</label>
        <input
          id="contrasena"
          name="contrasena"
          type="password"
          [(ngModel)]="contrasena"
          placeholder="Tu contrasena"
          required
        />
      </div>

      <button
        type="submit"
        class="btn-primario"
        [disabled]="cargando"
      >
        {{ cargando ? 'Entrando...' : 'Iniciar sesion 🌟' }}
      </button>
    </form>

    <p class="login-link">
      ¿No tienes cuenta?
      <a href="/register">Registrate</a>
    </p>
  </div>
</div>
